name: Deploy Web Test Build

# Publishes the prebuilt Flutter web app from the gh-pages branch to
# GitHub Pages so it can be tested in a browser before an APK is built.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the prebuilt web app (gh-pages branch)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
